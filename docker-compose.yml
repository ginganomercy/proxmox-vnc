version: '3.8'
services:
  vnc:
    image: ghcr.io/ginganomercy/proxmox-vnc:latest
    env_file:
      - .env
    networks:
      - front-tier
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

networks:
  front-tier:
    external: true
